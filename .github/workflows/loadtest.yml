name: load test

# Manual only, and only against a test environment: the guard in loadtest/guard.mjs refuses any other
# address (it is checked here before k6 starts, and again inside the script). Never wired to a push or
# a pull request, so the load test cannot run by accident. Results are attached as an artefact; the
# operator commits the ones worth keeping under loadtest/results/ with the date, commit and instance.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "The staging service's address, for example https://staging.example.com"
        required: true
      seed_leaf:
        description: "The id of the seeded chain's last stage (the last stage in web/snapshot/chain.json)"
        required: true
      profile:
        description: "smoke (a short check of the script) or full"
        default: smoke
        type: choice
        options: [smoke, full]
      caps:
        description: "Were the service's limits lifted for this run? (recorded in the summary; say what the environment really uses)"
        default: "defaults"
        type: choice
        options: [defaults, lifted]

permissions:
  contents: read

concurrency:
  group: loadtest
  cancel-in-progress: false

jobs:
  loadtest:
    name: k6 against the test environment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: the guard and the reconciliation have their own tests
        run: node --test loadtest/guard.test.mjs loadtest/reconcile.test.mjs
      - name: refuse anything that is not a test environment
        env:
          BASE_URL: ${{ inputs.base_url }}
          PRODUCTION_HOSTS: ${{ vars.GRAFT_PRODUCTION_HOSTS }}
          ALLOWED_HOSTS: ${{ vars.GRAFT_LOADTEST_HOSTS }}
        run: |
          node --input-type=module -e '
            import { checkTarget } from "./loadtest/guard.mjs";
            const v = checkTarget(process.env.BASE_URL, { productionHosts: process.env.PRODUCTION_HOSTS, allowedHosts: process.env.ALLOWED_HOSTS });
            if (!v.ok) { console.error("refusing to run: " + v.reason); process.exit(1); }
            console.log("target allowed: " + v.host);'
      - name: run k6 (pinned image)
        env:
          BASE_URL: ${{ inputs.base_url }}
          SEED_LEAF: ${{ inputs.seed_leaf }}
          PROFILE: ${{ inputs.profile }}
          PRODUCTION_HOSTS: ${{ vars.GRAFT_PRODUCTION_HOSTS }}
          ALLOWED_HOSTS: ${{ vars.GRAFT_LOADTEST_HOSTS }}
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/loadtest:/loadtest:ro" -v "$PWD/out:/out" \
            -e BASE_URL -e SEED_LEAF -e PROFILE -e PRODUCTION_HOSTS -e ALLOWED_HOSTS -e SUMMARY_OUT=/out/summary.json \
            grafana/k6@sha256:f21270290d702cbf0a7d6ba5d7ed100b63bcb233b558b885ed787547b3488279 run /loadtest/graft.js # grafana/k6:1.0.0
      - name: reconcile the client's counts with the service's and the database's
        run: node loadtest/reconcile.mjs out/summary.json
      - name: record how the run was made
        if: always()
        env:
          CAPS: ${{ inputs.caps }}
          PROFILE: ${{ inputs.profile }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          mkdir -p out
          {
            echo "run of commit $GITHUB_SHA on $(date -u +%Y-%m-%dT%H:%MZ), profile $PROFILE, limits: $CAPS"
            echo "target: $BASE_URL (instance size and region: the operator adds them when committing the result)"
          } | tee out/how.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: loadtest-results
          path: out/
