name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  repo:
    name: repo hygiene and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Tests for the repository scripts
        run: node --test scripts/*.test.mjs
      - name: Only code, scripts, README and ARCHITECTURE are tracked; no emails; vocabulary
        run: node scripts/check-repo.mjs
      - name: Pull request title is a plain conventional message
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/lint-commit-msg.mjs --title "$TITLE"
      - name: Every commit message is plain conventional text, no trailers
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: node scripts/lint-commit-msg.mjs --range "origin/$BASE..HEAD"

  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Crate dependency direction
        run: node scripts/check-crate-graph.mjs

  renderer:
    name: renderer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The committed vector table matches the independent reference
        run: python3 scripts/vectors/generate.py --check
      - name: Two builds from different directories are byte-identical
        run: sh scripts/check-reproducible.sh
      - name: Build the artefact
        run: sh scripts/build-wasm.sh
      - name: Hash matches the pin for this renderer version, pins are append-only
        env:
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          art=target/wasm32-unknown-unknown/wasm/graft_render.wasm
          if [ -n "$BASE" ]; then
            node scripts/check-wasm-pin.mjs "$art" --base "origin/$BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-wasm-pin.mjs "$art" --base "$BEFORE"
          else
            node scripts/check-wasm-pin.mjs "$art"
          fi
      - name: Vectors on native, wasmtime and the render host; module shape; host tests
        run: cargo test -p graft-vectors -p graft-render-host
      - name: Measure the render host on the worst-case renders
        run: |
          cargo run --release -q -p graft-render-host --example measure -- \
            target/wasm32-unknown-unknown/wasm/graft_render.wasm | tee measure.txt
          { echo '### Render host measurements'; echo '```'; cat measure.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  cross-host:
    name: cross-host vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ten times Linux minutes, so macOS arm64 runs after merges to the
        # long-lived branches and on demand, not on every pull request.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-14"]') }}
    defaults:
      run:
        working-directory: tools/vectors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: tools/vectors/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: tools/vectors/pnpm-lock.yaml
      - name: Install the pinned toolchain
        working-directory: .
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm audit --audit-level high
      - name: Browsers (Chromium, Firefox, WebKit)
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build the artefact and the replay command
        working-directory: .
        run: |
          sh scripts/build-wasm.sh
          cargo build -q -p graft-vectors --bin vectors-replay
      - name: Replay command, wasmtime and render host
        working-directory: .
        run: |
          art=target/wasm32-unknown-unknown/wasm/graft_render.wasm
          target/debug/vectors-replay --host wasmtime "$art" | tail -1
          target/debug/vectors-replay --host render-host "$art" | tail -1
          target/debug/vectors-replay --host native | tail -1
      - name: Rust harnesses (native, wasmtime, render host)
        working-directory: .
        run: cargo test -p graft-vectors
      - name: Node (V8), TypeScript port, Chromium, Firefox, WebKit
        run: pnpm test

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check
      - run: cargo audit

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (pinned checksum)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level high
