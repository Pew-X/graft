[package]
name = "graft-queue"
description = "The queue leg of the event path: a sink that sends batches to SQS and a consumer that applies them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
graft-storage.workspace = true
graft-events.workspace = true
tokio = { version = "1", features = ["time", "sync"] }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }

[dev-dependencies]
graft-storage = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
