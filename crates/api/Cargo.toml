[package]
name = "graft-api"
description = "HTTP layer, OpenAPI generation, rate limits, admin routes and configuration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "graft_api"

[[bin]]
name = "graft-api"
path = "src/main.rs"

[dependencies]
graft-domain.workspace = true
graft-storage.workspace = true
graft-render-host.workspace = true
graft-events.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "set-header", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "6"
getrandom = "0.3"
base64 = "0.22"
subtle = "2"
thiserror = "2"
futures = { version = "0.3", default-features = false, features = ["std"] }

opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = { version = "0.49", default-features = false }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio", "testing"] }
graft-storage = { workspace = true, features = ["test-support"] }
http-body-util = "0.1"
proptest = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }

[lints]
workspace = true
