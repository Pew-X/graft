[package]
name = "graft-api"
description = "HTTP layer, OpenAPI generation, rate limits, admin routes and configuration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "graft_api"

[[bin]]
name = "graft-api"
path = "src/main.rs"

[dependencies]
graft-domain.workspace = true
graft-storage.workspace = true
graft-render-host.workspace = true
graft-events.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "6"
getrandom = "0.3"
thiserror = "2"

[dev-dependencies]
graft-storage = { workspace = true, features = ["test-support"] }
http-body-util = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }

[lints]
workspace = true
