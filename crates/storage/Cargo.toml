[package]
name = "graft-storage"
description = "Postgres and blob store access behind traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Helpers that create a throwaway database per test; enabled by test crates only.
test-support = []

[dependencies]
graft-domain.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["time", "fs"] }
thiserror = "2"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
proptest = "1"
object_store = { version = "0.14", default-features = false, features = ["aws"] }

[lints]
workspace = true

[[test]]
name = "postgres"
required-features = ["test-support"]
