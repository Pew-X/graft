[package]
name = "graft-vectors"
description = "The renderer vector table: loader, input generators, and the native and wasmtime harnesses that replay it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
graft-render.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift"] }

[dev-dependencies]
wasmparser = "0.262"

[lints]
workspace = true
