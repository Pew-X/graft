[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # The Mozilla CA root bundle (webpki-root-certs), used for HTTPS to the object store. A permissive
  # data licence; allowed deliberately, for that crate's data only.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
