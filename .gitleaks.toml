# Extends gitleaks' default rules. The allowlist names only throwaway values that are deliberately in
# the repository: the credentials of a local test container (documented in README.md and used by CI)
# a fake operator secret that a test uses to prove secrets never reach the logs, and the fixed retry
# keys two browser tests send to prove a closed stage refuses a new flip, and the two operator secrets
# the local rehearsal script gives a private service it starts and removes. Nothing else is
# allowed; a real credential anywhere still fails the scan.
title = "graft"

[extend]
useDefault = true

[[allowlists]]
description = "throwaway credentials of the local and CI test object store, a fake test secret, two fixed test retry keys, and the local rehearsal's two operator secrets"
regexes = [
  '''graftsecret12345''',
  '''an-operator-secret-0123456789''',
  '''e2e-(closed|reopened)-0123456789abcdef''',
  '''rehearsal-secret-(one|two)-[0-9]{10}''',
]
